<!DOCTYPE html><html><head><meta charset="utf-8"><title>Create LunaPassport account</title><link rel="stylesheet" href="/static/css/main_api.css"><link rel="stylesheet" href="/static/properties.css"></head><body><div class="container"><div class="header"><div class="rl_l"><h1 class="txtr">LunaPassport</h1><div class="subtitle txtr">Sign in with .NET Passport</div></div></div><div class="headerline"></div><div class="main"><div class="content properties_content"><div class="properties_card"><div class="properties_intro"><h2>Create account</h2><p>Create credentials for LunaPassport and Partner SSO.</p></div><form action="/oauth/register" method="post"><fieldset class="properties_fieldset"><legend>Passport account</legend><div class="form_row"><label>E-mail address</label><input class="text_input" name="email" type="email" required></div><div class="form_row"><label>Passport name</label><input class="text_input" name="passport_name" required></div><div class="form_row"><label>Password</label><input class="text_input" name="password" type="password" minlength="8" required></div><div class="form_row"><label>Confirm password</label><input class="text_input" name="password_confirm" type="password" minlength="8" required></div><div class="form_row"><label>Secret question</label><input class="text_input" name="secret_question" required></div><div class="form_row"><label>Secret answer</label><input class="text_input" name="secret_answer" type="password" required></div></fieldset><div class="form_actions"><input class="primary_button" type="submit" value="Create account"> <a href="/oauth/login">Sign in</a></div></form></div></div></div></div></body></html>
