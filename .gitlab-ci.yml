stages:
  - test
  - version
  - build
  - release

variables:
  GO_VERSION: "1.23"
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/go-mod"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"

cache:
  key: "go-${CI_COMMIT_REF_SLUG}"
  paths:
    - .cache/go-mod
    - .cache/go-build

test:
  stage: test
  image: "golang:${GO_VERSION}"
  script:
    - go test ./...
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

version:
  stage: version
  image: "golang:${GO_VERSION}"
  resource_group: automatic-release
  variables:
    GIT_FETCH_EXTRA_FLAGS: "--tags"
  script:
    - |
      latest="$(git tag --list 'v*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
      if [ -z "$latest" ]; then
        next="v0.1.0"
      else
        version="${latest#v}"
        IFS=. read -r major minor patch <<EOF
      $version
      EOF
        next="v${major}.${minor}.$((patch + 1))"
      fi
      echo "Automatic version: $next"
      echo "RELEASE_TAG=$next" > release.env
  artifacts:
    reports:
      dotenv: release.env
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'

build-release:
  stage: build
  image: "golang:${GO_VERSION}"
  needs:
    - job: version
      artifacts: true
      optional: true
  script:
    - mkdir -p dist
    - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/lunapassport-linux-amd64 ./cmd/lunapassport
    - CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/lunapassport-windows-amd64.exe ./cmd/lunapassport
    - sha256sum dist/* > dist/SHA256SUMS
    - 'if [ -z "$RELEASE_TAG" ]; then RELEASE_TAG="$CI_COMMIT_TAG"; fi'
    - 'test -n "$RELEASE_TAG"'
    - 'echo "RELEASE_TAG=$RELEASE_TAG" > release.env'
  artifacts:
    name: "passport-${CI_COMMIT_REF_SLUG}-${CI_PIPELINE_IID}"
    paths:
      - dist/
    reports:
      dotenv: release.env
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  resource_group: automatic-release
  needs:
    - job: build-release
      artifacts: true
  script:
    - 'which curl >/dev/null || (apk add --no-cache curl)'
    - |
      for file in dist/*; do
        name="$(basename "$file")"
        curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$file" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/passport/${RELEASE_TAG}/${name}"
      done
    - |
      printf '%s\n\n' "Passport ${RELEASE_TAG}" > release-notes.md
      printf '%s\n' 'This release contains reproducible standard Go builds for the Passport mock.' >> release-notes.md
      printf '%s\n' '' >> release-notes.md
      printf '%s\n' '- `passport-mock-linux-amd64`' >> release-notes.md
      printf '%s\n' '- `passport-mock-windows-amd64.exe`' >> release-notes.md
      printf '%s\n' '- `SHA256SUMS`' >> release-notes.md
  release:
    tag_name: "$RELEASE_TAG"
    ref: "$CI_COMMIT_SHA"
    name: "Passport $RELEASE_TAG"
    description: ./release-notes.md
    assets:
      links:
        - name: passport-mock-linux-amd64
          url: "${CI_PROJECT_URL}/-/packages/generic/passport/${RELEASE_TAG}/passport-mock-linux-amd64"
          filepath: "/passport-mock-linux-amd64"
          link_type: package
        - name: passport-mock-windows-amd64.exe
          url: "${CI_PROJECT_URL}/-/packages/generic/passport/${RELEASE_TAG}/passport-mock-windows-amd64.exe"
          filepath: "/passport-mock-windows-amd64.exe"
          link_type: package
        - name: SHA256SUMS
          url: "${CI_PROJECT_URL}/-/packages/generic/passport/${RELEASE_TAG}/SHA256SUMS"
          filepath: "/SHA256SUMS"
          link_type: other
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
