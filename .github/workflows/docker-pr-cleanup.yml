name: 🧹 Clean up PR images

on:
  pull_request:
    types:
      - closed
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  packages: write
  pull-requests: read

jobs:
  cleanup:
    name: 🧹 Delete stale PR images
    runs-on: ubuntu-latest

    steps:
      - name: Remove matching GHCR package versions
        uses: actions/github-script@v7
        env:
          PACKAGE_NAME: ${{ github.event.repository.name }}
          STALE_DAYS: '30'
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const packageName = process.env.PACKAGE_NAME.toLowerCase();
            const staleBefore = Date.now() - Number(process.env.STALE_DAYS) * 24 * 60 * 60 * 1000;

            const { data: repository } = await github.rest.repos.get({ owner, repo });
            const packageScope = repository.owner.type === 'Organization'
              ? `/orgs/${owner}`
              : '/user';
            const versionsPath = `${packageScope}/packages/container/${packageName}/versions`;
            const deleteVersion = (versionId) =>
              github.request(`DELETE ${versionsPath}/${versionId}`);

            const versions = await github.paginate(github.request, {
              url: versionsPath,
              per_page: 100
            });

            const pullRequests = context.eventName === 'pull_request'
              ? [context.payload.pull_request]
              : await github.paginate(github.rest.pulls.list, {
                  owner,
                  repo,
                  state: 'all',
                  per_page: 100
                });

            const candidates = pullRequests.filter((pullRequest) =>
              pullRequest.state === 'closed' ||
              new Date(pullRequest.updated_at).getTime() < staleBefore
            );

            const deleted = [];
            for (const pullRequest of candidates) {
              const prTag = `pr-${pullRequest.number}`;
              const matches = versions.filter((version) =>
                version.metadata?.container?.tags?.includes(prTag)
              );

              for (const version of matches) {
                await deleteVersion(version.id);
                deleted.push(`${prTag} (version ${version.id})`);
              }

              if (matches.length > 0) {
                const reason = pullRequest.state === 'closed'
                  ? 'the pull request was closed'
                  : 'the pull request had no updates for 30 days';
                const marker = 'Docker image for this PR was removed from GHCR.';
                const body = [
                  `🧹 ${marker}`,
                  '',
                  `The image \`ghcr.io/${owner}/${packageName}:${prTag}\` was deleted because ${reason}.`
                ].join('\n');

                const { data: comments } = await github.rest.issues.listComments({
                  owner,
                  repo,
                  issue_number: pullRequest.number,
                  per_page: 100
                });
                const existing = comments.find((comment) =>
                  comment.user?.type === 'Bot' && comment.body?.includes(marker)
                );

                if (existing) {
                  await github.rest.issues.updateComment({
                    owner,
                    repo,
                    comment_id: existing.id,
                    body
                  });
                } else {
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: pullRequest.number,
                    body
                  });
                }
              }
            }

            if (deleted.length === 0) {
              core.info('No stale PR images found.');
            } else {
              core.info(`Deleted ${deleted.length} PR image version(s): ${deleted.join(', ')}`);
            }
